server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React SPA: route yang tidak match file statis jatuh ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html harus SELALU dicek ulang - kalau di-cache browser, build
    # baru (fitur/fix baru) tidak akan pernah kelihatan sampai hard refresh.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # File di /assets/ punya nama ber-hash dari Vite (index-XXXXX.js) -
    # begitu isinya beda, nama filenya juga beda, jadi aman di-cache lama.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # MJPEG stream: proxy_buffering harus mati, kalau tidak nginx akan
    # menahan frame sampai buffer penuh dan video terlihat macet/patah.
    location /api/stream {
        proxy_pass http://backend:8000/api/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
