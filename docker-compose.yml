services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Jakarta
    volumes:
      - ./config:/app/config:ro
      - ./outputs:/app/outputs
      - ./data:/app/data
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://backend:8000
      - TZ=Asia/Jakarta
    volumes:
      - ./config:/app/config:ro
      - ./outputs:/app/outputs
      - ./worker/models:/app/models:ro
      - ./worker/videos:/app/videos:ro
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
