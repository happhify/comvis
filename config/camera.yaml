cameras:
  default: "kamera_1"
  fallback_video: "videos/Video Project.mp4"

  list:
    - id: "kamera_1"
      name: "GDG PUSDATIN LT 1.1"
      rtsp_env_key: "RTSP_URL"

    - id: "kamera_2"
      name: "GDG PUSDATIN LT 1.2"
      rtsp_env_key: "RTSP_URL_2"

preview:
  window_name: "Preview CCTV - Kamera 1"
  resize_width: 960
  show_fps: true

connection:
  reconnect: true
  reconnect_delay_seconds: 3
  max_failed_reads: 30

detection:
  enabled: true
  model_path: "models/yolov8m.pt"
  confidence_threshold: 0.35
  device: 0

recognition:
  enabled: true
  model_path: "models/body_best.pt"
  device: 0
  verified_threshold: 0.90
  unknown_threshold: 0.70
  min_margin: 0.40
  min_crop_width: 40
  min_crop_height: 80
  
output:
  save_video: true
  video_output_path: "outputs/videos/result_kamera_1.mp4"

  save_crops: true
  crop_output_dir: "outputs/crops"
  crop_every_n_frames: 10

  save_log: true
  log_output_path: "outputs/logs/detection_log.csv"

realtime:
  resize_width: 960
  detection_interval: 1
  recognition_interval: 10
  cache_ttl_frames: 30
  cache_iou_threshold: 0.35

runtime_monitor:
  enabled: true
  summary_json_path: "outputs/logs/runtime_summary.json"
  summary_csv_path: "outputs/logs/runtime_summary.csv"